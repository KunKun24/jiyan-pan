name: docker

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (amd64)
        run: |
          docker build -t pandisk:smoke .
          docker run -d --name pandisk-smoke -p 18080:80 pandisk:smoke
          for i in $(seq 1 20); do
            sleep 2
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/assets/logo.png || true)
            [ "$code" = "200" ] && break
          done
          echo "static=$code"
          [ "$code" = "200" ] || { docker logs pandisk-smoke; exit 1; }
          idx=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ || true)
          echo "index=$idx"
          [ "$idx" != "502" ] || { docker logs pandisk-smoke; exit 1; }
          docker logs pandisk-smoke | tail -20
          docker rm -f pandisk-smoke
