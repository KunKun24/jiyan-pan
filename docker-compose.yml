services:
  app:
    build: .
    image: ghcr.io/kunkun24/jiyan-pan:latest
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-pandisk}
      DB_USER: ${DB_USER:-pandisk}
      DB_PASS: ${DB_PASS:-pandisk-change-me}
      SITE_URL: ${SITE_URL:-}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-pandisk}
      MARIADB_USER: ${DB_USER:-pandisk}
      MARIADB_PASSWORD: ${DB_PASS:-pandisk-change-me}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root-change-me}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - db:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  storage:
  db:
